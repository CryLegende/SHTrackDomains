# SHTrackDomains — d'où viennent les joueurs
#
# Chaque connexion est rattachée à une « source » d'après l'adresse tapée par le joueur
# (l'adresse vue par le proxy). La première connexion d'un pseudo fixe sa source pour toujours.
#
# Commandes (alias /shtd ; les textes sont dans messages.yml) :
#   /shtrackdomains list                 Domaines utilisés, joueurs en ligne et connexions au total.
#   /shtrackdomains show <domaine>       Joueurs connectés via ce domaine.
#   /shtrackdomains sources [jours]      Nouveaux joueurs et connexions par source (30 jours par défaut).
#   /shtrackdomains player <pseudo>      Source, historique et temps de jeu d'un joueur (ancien nom : joueur).
#   /shtrackdomains reload               Relit config.yml et messages.yml. Appliqué tout de suite : domaine, sources,
#                                        table-authme, nouveau-joueur-heures. Demande un redémarrage du proxy :
#                                        base-de-donnees (actif, url, utilisateur, mot-de-passe) et temps-de-jeu.serveurs.
#                                        data.yml (compteurs) n'est jamais relu.
#
# Permissions (LuckPerms du proxy) : shtrackdomains.admin.<sous-commande> pour une sous-commande, ou
# shtrackdomains.admin pour toutes :
#   shtrackdomains.admin.list, shtrackdomains.admin.show, shtrackdomains.admin.sources, shtrackdomains.admin.player,
#   shtrackdomains.admin.reload
#
# Attention aux enregistrements SRV : le client Minecraft envoie la CIBLE du SRV, pas l'adresse
# tapée. example.com et play.example.com doivent donc pointer vers des cibles distinctes
# (direct.example.com, play-srv.example.com), sinon on ne peut plus les séparer.

# Domaine de base : <code>.example.com (absent de « sources ») donne la source « <code> ».
# C'est ce qui sert pour les créateurs (pseudo.example.com) et les campagnes ; la liste des créateurs,
# leurs campagnes, leurs statistiques et le cadeau de première connexion sont gérés par le site
# (plugin skyhandcreators, panel « Créateurs »).
# Il faut l'enregistrement DNS générique *.example.com et « *.example.com » dans hostname-whitelist.
domaine: example.com

# Adresse exacte -> nom de la source dans /shtd sources.
sources:
  # Listes de serveurs (une adresse par liste, celle affichée sur la fiche)
  mc1.example.com: liste-serveurs-exemple.org
  # Cibles SRV des adresses courtes
  direct.example.com: direct (example.com)
  play-srv.example.com: play.example.com
  # Clients qui ne suivent pas le SRV (launchers tiers)
  example.com: direct (example.com)
  127.0.0.1: local

base-de-donnees:
  # false : seuls les compteurs de data.yml (/shtd list) fonctionnent.
  actif: true
  url: jdbc:mariadb://127.0.0.1:3306/minecraft
  utilisateur: minecraft
  mot-de-passe: CHANGE_ME
  # Table AuthMe (même base) : sert à savoir si un pseudo est nouveau.
  table-authme: authme
  # Un compte AuthMe plus jeune que ça compte encore comme nouveau joueur
  # (inscription faite sur le site avant la première connexion).
  nouveau-joueur-heures: 168

temps-de-jeu:
  # Serveurs (noms de velocity.toml) dont on mesure le temps de jeu, par joueur et par jour, dans la
  # table sh_acq_playtime. Le site s'en sert pour les conditions des créateurs (« au moins 60 minutes
  # sur survie dans les 14 premiers jours »). Liste vide ou clé absente : pas de mesure.
  serveurs:
    - survie
